<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#9C6CDA" />
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="40" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9C6CDA" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer gradient ring -->
  <circle cx="80" cy="80" r="70" stroke="url(#ring)" stroke-width="10" fill="none"/>

  <!-- Inner dark disc -->
  <circle cx="80" cy="80" r="56" fill="#121212" />

  <!-- Stylized book (productivity/learning) -->
  <g filter="url(#shadow)">
    <path d="M54 56c0-4.418 3.582-8 8-8h22c8.837 0 16 7.163 16 16v38c0 2.209-1.791 4-4 4H62c-4.418 0-8-3.582-8-8V56z" fill="#1E1E1E" stroke="url(#ring)" stroke-width="2"/>
    <path d="M62 52h22c6.627 0 12 5.373 12 12v34H74c-6.627 0-12-5.373-12-12V52z" fill="#1A1A1A"/>
    <path d="M66 66h28" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 76h24" stroke="#4ECDC4" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 86h18" stroke="#9C6CDA" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Clock hand overlay (time tracking) -->
  <g>
    <circle cx="98" cy="66" r="10" fill="#0F0F0F" stroke="url(#ring)" stroke-width="2"/>
    <path d="M98 66l8 6" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M98 66v-8" stroke="#9C6CDA" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Spark accents -->
  <circle cx="40" cy="40" r="2" fill="#00E5FF"/>
  <circle cx="28" cy="86" r="1.5" fill="#4ECDC4"/>
  <circle cx="126" cy="48" r="2" fill="#9C6CDA"/>
</svg>


